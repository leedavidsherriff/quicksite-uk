<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Tell us about your business in ten quick questions and we'll build your website. Free to try, £30 a month to keep — every question is optional.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://leedavidsherriff.github.io/quicksite-uk/brochure/brief.html">
<meta property="og:title" content="Build your website brief — QuickSite">
<meta property="og:description" content="Ten quick questions, then we build your site. Free to try, £30 a month to keep.">
<meta property="og:image" content="https://leedavidsherriff.github.io/quicksite-uk/brochure/og.jpg">
<meta name="theme-color" content="#F26F21">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F26F21; --orangeDark:#D45A12; --navy:#0F172A; --slate:#F8FAFC;
    --peach:#FFF0E5; --muted:#5A6472; --border:#E3E8EF; --cardbg:#FFFFFF;
    --text:var(--navy); --bg:var(--slate);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0D1117; --text:#E9EEF5; --muted:#A5B0BF; --border:#242C38; --cardbg:#161C25; --peach:#221913; }
  }
  :root[data-theme="dark"]{ --bg:#0D1117; --text:#E9EEF5; --muted:#A5B0BF; --border:#242C38; --cardbg:#161C25; --peach:#221913; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",Helvetica,Arial,sans-serif;line-height:1.5;}
  .wrap{max-width:580px;margin:0 auto;padding:28px 20px 70px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  /* the real animated mark, in a white chip so it reads in dark mode too */
  .brandmark{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px 10px;text-decoration:none;}
  .brandmark img{height:40px;width:auto;display:block;}
  .counter{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}

  .bar{height:6px;background:var(--border);border-radius:999px;margin:18px 0 0;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--orange);border-radius:999px;transition:width .3s ease;}

  .eyebrow{font-size:11px;font-weight:800;letter-spacing:0.16em;color:var(--orange);margin-top:26px;}
  h1{font-size:clamp(24px,6.5vw,30px);line-height:1.14;font-weight:800;letter-spacing:-0.025em;margin:8px 0 0;}
  p.lead{margin:9px 0 0;font-size:15px;color:var(--muted);max-width:48ch;}

  .card{display:none;}
  .card.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .opts{margin-top:18px;display:flex;flex-direction:column;gap:9px;}
  .opts.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  @media (max-width:430px){.opts.two{grid-template-columns:1fr;}}
  .opt{border:1px solid var(--border);background:var(--cardbg);border-radius:13px;padding:15px 17px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;font-family:inherit;color:inherit;}
  .opt small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px;}
  .opt:active{background:var(--peach);}
  .opt .arrow{color:var(--orange);font-size:17px;flex-shrink:0;}
  .opt.sel{border-color:var(--orange);background:var(--peach);}
  .opt.sel .tick{background:var(--orange);border-color:var(--orange);}
  .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .tick svg{opacity:0;}
  .opt.sel .tick svg{opacity:1;}

  .fields{margin-top:18px;display:flex;flex-direction:column;gap:14px;}
  label{font-size:12.5px;font-weight:700;letter-spacing:0.04em;color:var(--muted);display:block;margin-bottom:6px;}
  input,textarea{width:100%;border:1px solid var(--border);background:var(--cardbg);color:var(--text);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;}
  textarea{resize:vertical;min-height:80px;}
  input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px;}

  .swatches{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sw{border:1px solid var(--border);background:var(--cardbg);border-radius:13px;padding:12px;cursor:pointer;font-family:inherit;color:inherit;text-align:center;}
  .sw.sel{border-color:var(--orange);background:var(--peach);}
  .sw .strip{height:34px;border-radius:8px;display:flex;overflow:hidden;margin-bottom:8px;}
  .sw .strip span{flex:1;}
  .sw b{font-size:12.5px;font-weight:700;}

  .nav{margin-top:22px;display:flex;align-items:center;gap:10px;}
  .btn{appearance:none;border:none;border-radius:999px;padding:13px 20px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;text-decoration:none;}
  .btn-primary{background:var(--orange);color:#fff;flex:1;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-full{width:100%;}
  .btn-wa{background:#25D366;color:#08380f;}
  .btn-mail{background:var(--navy);color:#fff;}
  :root[data-theme="dark"] .btn-mail{background:var(--cardbg);color:var(--text);border:1px solid var(--border);}
  @media (prefers-color-scheme: dark){ .btn-mail{background:var(--cardbg);color:var(--text);border:1px solid var(--border);} }
  .backbtn{background:none;border:none;color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;padding:8px 0;font-family:inherit;}

  /* review */
  .summary{margin-top:18px;background:var(--cardbg);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .srow{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;}
  .srow:last-child{border-bottom:none;}
  .srow .k{font-weight:700;min-width:118px;flex-shrink:0;}
  .srow .v{color:var(--muted);}
  .srow .v.empty{font-style:italic;opacity:.7;}
  .pricebar{margin-top:18px;background:var(--navy);color:#fff;border-radius:12px;padding:15px 18px;font-size:14.5px;font-weight:700;}
  .pricebar .o{color:var(--orange);}
  :root[data-theme="dark"] .pricebar{background:var(--cardbg);border:1px solid var(--border);}
  @media (prefers-color-scheme: dark){ .pricebar{background:var(--cardbg);border:1px solid var(--border);} }
  .send-row{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .err{font-size:12.5px;color:#C0392B;display:none;margin-top:8px;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);}
  footer a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brandmark" href="index.html" aria-label="QuickSite — home"><img src="quicksite-mark.webp" alt="QuickSite — websites, built in minutes" width="930" height="294"></a>
    <div class="counter" id="counter"></div>
  </div>
  <div class="bar"><i id="barfill"></i></div>

  <div id="stage"></div>

  <footer>
    Every question is optional — skip anything you're not sure about.<br>
    Your answers go straight to us by WhatsApp or email when you press send — nothing is stored on this page.
    <a href="https://leedavidsherriff.github.io/quicksite-uk/privacy.html">Privacy policy</a> · <a href="cookies.html">Cookies</a><br>
    QuickSite is a trading name of Quick Site Digital Limited · 07933 666396 · Lee@quick-site.co.uk
  </footer>
</div>

<script>
(function(){
  var TICK='<span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>';
  var ARROW='<span class="arrow">&rarr;</span>';

  var D = {}; // answers

  var STEPS = [
    { id:'trade', type:'single', eyebrow:'YOUR BUSINESS', q:"What's your trade?",
      lead:"So we start from the right template — not a blank page.",
      two:true,
      opts:['Builder / construction','Roofer','Electrician','Plumber / heating','Tiler','Landscaper / gardener',
            'Plasterer / decorator','Takeaway / restaurant','Cafe / bar','Beauty / hair / nails',
            'Finance / insurance / advice','Cleaning','Removals / haulage','Something else'] },

    { id:'basics', type:'fields', eyebrow:'YOUR BUSINESS', q:"What's it called, and where?",
      lead:"This is what goes at the top of the site.",
      fields:[
        {k:'business', l:'Business name', ph:'e.g. Right Price Builders'},
        {k:'town', l:'Main town or city', ph:'e.g. Bridgend'},
        {k:'areas', l:'Other areas you cover', ph:'e.g. Porthcawl, Cowbridge, Cardiff'},
        {k:'years', l:'How long have you been going?', ph:"e.g. 12 years"}
      ]},

    { id:'goal', type:'single', eyebrow:'THE POINT OF IT', q:"What should the site mainly do?",
      lead:"Pick the big one — we'll build everything around it.",
      opts:[
        ['Get me enquiries','Calls, messages and forms landing in your phone'],
        ['Show my prices','So people arrive already knowing the cost'],
        ['Take bookings','Slots, jobs or tables booked without a phone call'],
        ['Show off my work','Galleries and before-and-afters that sell it'],
        ['Look legitimate','Somewhere to send people who check you out first']
      ]},

    { id:'services', type:'fields', eyebrow:'WHAT YOU DO', q:"What jobs do you want on the site?",
      lead:"Just list them how you'd say them out loud.",
      fields:[
        {k:'services', l:'Your main services', ph:'e.g. extensions, loft conversions, garage conversions, driveways', ta:true},
        {k:'best', l:"The job you most want more of", ph:'e.g. full house renovations'},
        {k:'avoid', l:"Anything you DON'T want enquiries for", ph:"e.g. small repair jobs, anything over an hour away"}
      ]},

    { id:'tools', type:'multi', eyebrow:'THE CLEVER BITS', q:"What should it be able to do?",
      lead:"Tap as many as you fancy. All included — nothing costs extra.",
      opts:[
        ['Instant price calculator','They answer a few questions, get a price'],
        ['Online booking','Pick a slot, straight into your diary'],
        ['Build-your-own menu','Live prices as they add items'],
        ['Before-and-after gallery','Slider showing the transformation'],
        ['Cinema-quality animations','Your work shown like a film'],
        ['Customer reviews','Pulled in and shown properly'],
        ['Quote request form','Photos and details sent to you'],
        ['WhatsApp button','One tap straight to your phone'],
        ['Finance / payment plans','Show monthly costs, not just totals'],
        ['Area map','Show exactly where you cover']
      ]},

    { id:'style', type:'single', eyebrow:'THE LOOK', q:"What feel are you after?",
      lead:"There's no wrong answer — we'll show you before you commit.",
      opts:[
        ['Bold and modern','Big type, strong colour, confident'],
        ['Clean and simple','Plenty of space, easy to read'],
        ['Premium and dark','Moody, high-end, expensive-looking'],
        ['Friendly and bright','Warm, approachable, local'],
        ['Rugged and industrial','Hard-wearing, tradesman, no-nonsense'],
        ["Not sure — you pick","We'll choose what suits your trade"]
      ]},

    { id:'colours', type:'swatch', eyebrow:'THE LOOK', q:"Any colours in mind?",
      lead:"If you've got brand colours already, say so on the next screen.",
      opts:[
        ['Blues',['#0F3A6B','#2C6FB5','#9FC4E8']],
        ['Greens',['#14532D','#3F8F5B','#B7DBC2']],
        ['Reds',['#7A1220','#C0392B','#F0B3AC']],
        ['Orange',['#B54A0E','#F26F21','#FBD1B0']],
        ['Black & white',['#0F172A','#64748B','#E2E8F0']],
        ['Earthy',['#4A3524','#A9743F','#E5D3BC']]
      ]},

    { id:'assets', type:'multi', eyebrow:'WHAT YOU'+"'"+'VE GOT', q:"What have you already got?",
      lead:"Don't worry if it's none of it — we sort all of this.",
      opts:[
        ['A logo','Even a rough one'],
        ['Photos of your work','Phone photos are fine'],
        ['A domain name','e.g. yourbusiness.co.uk'],
        ['An existing website','We can rebuild from it'],
        ['Google Business listing','We link it up'],
        ['Social media pages','Facebook, Instagram, TikTok'],
        ['Reviews or testimonials','Written or on Google'],
        ['Price list','Even a rough one']
      ]},

    { id:'refs', type:'fields', eyebrow:'ANYTHING ELSE', q:"Anything you want us to see?",
      lead:"A site you like the look of tells us more than a paragraph.",
      fields:[
        {k:'likes', l:'A website you like (any industry)', ph:'Paste a link, or just name it'},
        {k:'current', l:'Your current site, if you have one', ph:'yourbusiness.co.uk'},
        {k:'brandcolours', l:'Your brand colours, if you have them', ph:"e.g. navy and yellow, like the vans"},
        {k:'notes', l:'Anything else we should know', ph:'Anything at all.', ta:true}
      ]},

    { id:'contact', type:'fields', eyebrow:'LAST BIT', q:"Who are we building this for?",
      lead:"So we can send the link over when it's ready.",
      fields:[
        {k:'name', l:'Your name', ph:'', req:true},
        {k:'phone', l:'WhatsApp / phone', ph:'07xxx xxxxxx'},
        {k:'email', l:'Email', ph:'you@yourbusiness.co.uk'}
      ]}
  ];

  var idx = 0;
  var stage = document.getElementById('stage');

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function chrome(){
    document.getElementById('counter').textContent =
      idx < STEPS.length ? ('Step ' + (idx+1) + ' of ' + (STEPS.length+1)) : 'Review';
    document.getElementById('barfill').style.width =
      Math.round(((idx)/(STEPS.length))*100) + '%';
  }

  function head(s){
    return '<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.q+'</h1>'+(s.lead?'<p class="lead">'+s.lead+'</p>':'');
  }

  function navHtml(s, primaryLabel){
    var back = idx>0 ? '<button class="backbtn" id="back">&larr; Back</button>' : '';
    var prim = primaryLabel ? '<button class="btn btn-primary" id="next">'+primaryLabel+'</button>' : '';
    var skip = '<button class="btn btn-ghost" id="skip">Skip</button>';
    return '<div class="nav">'+prim+skip+'</div>'+(back?'<div>'+back+'</div>':'');
  }

  function render(){
    chrome();
    if(idx >= STEPS.length){ return renderReview(); }
    var s = STEPS[idx];
    var h = head(s);

    if(s.type==='single'){
      h += '<div class="opts'+(s.two?' two':'')+'">';
      s.opts.forEach(function(o){
        var label = Array.isArray(o)?o[0]:o, sub = Array.isArray(o)?o[1]:null;
        h += '<button class="opt" data-v="'+esc(label)+'"><span>'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'+ARROW+'</button>';
      });
      h += '</div>' + navHtml(s, null);
      stage.innerHTML = h;
      stage.querySelectorAll('.opt').forEach(function(b){
        b.onclick = function(){ D[s.id] = b.getAttribute('data-v'); go(1); };
      });
    }

    else if(s.type==='multi'){
      var cur = D[s.id] || [];
      h += '<div class="opts">';
      s.opts.forEach(function(o){
        var label = Array.isArray(o)?o[0]:o, sub = Array.isArray(o)?o[1]:null;
        var on = cur.indexOf(label)>-1;
        h += '<button class="opt'+(on?' sel':'')+'" data-v="'+esc(label)+'"><span>'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'+TICK+'</button>';
      });
      h += '</div>' + navHtml(s, 'Continue');
      stage.innerHTML = h;
      stage.querySelectorAll('.opt').forEach(function(b){
        b.onclick = function(){
          var v = b.getAttribute('data-v');
          var arr = D[s.id] || [];
          var i = arr.indexOf(v);
          if(i>-1) arr.splice(i,1); else arr.push(v);
          D[s.id] = arr;
          b.classList.toggle('sel');
        };
      });
    }

    else if(s.type==='swatch'){
      var cur2 = D[s.id];
      h += '<div class="swatches">';
      s.opts.forEach(function(o){
        var strip = o[1].map(function(c){ return '<span style="background:'+c+'"></span>'; }).join('');
        h += '<button class="sw'+(cur2===o[0]?' sel':'')+'" data-v="'+esc(o[0])+'"><div class="strip">'+strip+'</div><b>'+esc(o[0])+'</b></button>';
      });
      h += '</div>' + navHtml(s, 'Continue');
      stage.innerHTML = h;
      stage.querySelectorAll('.sw').forEach(function(b){
        b.onclick = function(){
          stage.querySelectorAll('.sw').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel'); D[s.id] = b.getAttribute('data-v');
        };
      });
    }

    else if(s.type==='fields'){
      h += '<div class="fields">';
      s.fields.forEach(function(f){
        var val = (D[f.k]||'');
        h += '<div><label for="f_'+f.k+'">'+esc(f.l)+'</label>' +
             (f.ta ? '<textarea id="f_'+f.k+'" placeholder="'+esc(f.ph)+'">'+esc(val)+'</textarea>'
                   : '<input id="f_'+f.k+'" value="'+esc(val)+'" placeholder="'+esc(f.ph)+'">') +
             '</div>';
      });
      h += '</div><div class="err" id="fieldErr">Please add your name so we know who to send it to.</div>' + navHtml(s, 'Continue');
      stage.innerHTML = h;
    }

    var nx = document.getElementById('next');
    if(nx) nx.onclick = function(){ if(saveFields(s)) go(1); };
    document.getElementById('skip').onclick = function(){ saveFields(s, true); go(1); };
    var bk = document.getElementById('back');
    if(bk) bk.onclick = function(){ saveFields(s, true); go(-1); };
  }

  function saveFields(s, lenient){
    if(!s || s.type!=='fields') return true;
    s.fields.forEach(function(f){
      var el = document.getElementById('f_'+f.k);
      if(el) D[f.k] = el.value.trim();
    });
    if(!lenient){
      var needsName = s.fields.some(function(f){ return f.req; });
      if(needsName && !D.name){
        document.getElementById('fieldErr').style.display='block';
        return false;
      }
    }
    return true;
  }

  function go(n){
    idx = Math.max(0, Math.min(STEPS.length, idx+n));
    window.scrollTo({top:0,behavior:'smooth'});
    render();
  }

  function val(k){
    var v = D[k];
    if(Array.isArray(v)) return v.length ? v.join(', ') : '';
    return v || '';
  }

  var REVIEW = [
    ['Trade','trade'],['Business','business'],['Town','town'],['Also covers','areas'],['Years going','years'],
    ['Main goal','goal'],['Services','services'],['Wants more of','best'],['Not interested in','avoid'],
    ['Features','tools'],['Style','style'],['Colours','colours'],['Brand colours','brandcolours'],
    ['Already has','assets'],['Likes the look of','likes'],['Current site','current'],['Notes','notes'],
    ['Name','name'],['Phone','phone'],['Email','email']
  ];

  function renderReview(){
    document.getElementById('barfill').style.width='100%';
    var rows = REVIEW.map(function(r){
      var v = val(r[1]);
      return '<div class="srow"><div class="k">'+r[0]+'</div><div class="v'+(v?'':' empty')+'">'+(v?esc(v):'not given')+'</div></div>';
    }).join('');

    stage.innerHTML =
      '<div class="eyebrow">YOUR BRIEF</div>' +
      '<h1>That’s everything we need.</h1>' +
      '<p class="lead">Have a quick look, then send it over. We’ll build it and send you a real link — you decide after that.</p>' +
      '<div class="summary">'+rows+'</div>' +
      '<div class="pricebar">Free to try. £30/month to keep. <span class="o">No catch.</span></div>' +
      '<div class="send-row">' +
        '<a class="btn btn-wa btn-full" id="waBtn" href="#" target="_blank" rel="noopener">Send brief via WhatsApp</a>' +
        '<a class="btn btn-mail btn-full" id="mailBtn" href="#">Send brief via Email</a>' +
        '<button class="btn btn-ghost btn-full" id="editBtn">Go back and change something</button>' +
      '</div>';

    var lines = ['QuickSite website brief',''];
    REVIEW.forEach(function(r){ var v=val(r[1]); if(v) lines.push(r[0]+': '+v); });
    var text = lines.join('\n');
    document.getElementById('waBtn').href='https://wa.me/447933666396?text='+encodeURIComponent(text);
    document.getElementById('mailBtn').href='mailto:Lee@quick-site.co.uk?subject='+
      encodeURIComponent('QuickSite brief — '+(val('business')||val('name')||'New enquiry'))+
      '&body='+encodeURIComponent(text);
    document.getElementById('editBtn').onclick=function(){ go(-1); };
  }

  render();
})();

/* Same anonymous page-view counter as the rest of the site: page name + referring
   domain only, no cookies, nothing about what anyone types into the form. */
(function(){
  if(location.hostname==='localhost'||location.hostname==='127.0.0.1') return;
  try{
    var rf=''; try{ rf=document.referrer?new URL(document.referrer).hostname:''; }catch(e){}
    fetch('https://quicksite-stats-89aa38a9.base44.app/api/functions/hit',{method:'POST',mode:'cors',keepalive:true,
      headers:{'Content-Type':'text/plain'},body:JSON.stringify({page:'brief.html',ref:rf})}).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
