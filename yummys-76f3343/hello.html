<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="YUMMIES — we built you a website" />
    <meta property="og:description" content="Tap in and build a kebab. The order lands straight on your WhatsApp — no middleman, no commission." />
    <meta property="og:image" content="https://leedavidsherriff.github.io/yummies/og.jpg" />
    <meta property="og:url" content="https://leedavidsherriff.github.io/yummies/hello.html" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0A0A'/%3E%3Ctext x='50' y='72' font-family='Arial Black,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23D81F26'%3EY%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --charcoal: #0a0a0a;
        --ember: #d81f26;
        --amber: #f0a81e;
        --cream: #f6efe4;
        --smoke: #8b8279;
      }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 0;
        padding: 32px 24px 40px;
        background:
          radial-gradient(90% 55% at 50% 108%, rgba(216, 31, 38, 0.22) 0%, rgba(216, 31, 38, 0.05) 45%, transparent 70%),
          var(--charcoal);
        color: var(--cream);
        font-family: 'Space Grotesk', system-ui, sans-serif;
        line-height: 1.55;
      }
      .kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--amber);
      }
      h1 {
        font-family: 'Anton', 'Arial Narrow', sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        line-height: 0.92;
        font-size: clamp(64px, 18vw, 130px);
        margin-top: 18px;
        text-shadow: 0 0 60px rgba(216, 31, 38, 0.35);
      }
      h1 span { color: var(--ember); }
      .msg {
        font-family: 'Anton', 'Arial Narrow', sans-serif;
        text-transform: uppercase;
        font-size: clamp(26px, 7vw, 44px);
        line-height: 1.05;
        margin-top: 34px;
        letter-spacing: 0.02em;
      }
      .msg em { font-style: normal; color: var(--ember); }
      .sub {
        max-width: 34ch;
        margin: 22px auto 0;
        font-size: clamp(15px, 4vw, 18px);
        font-weight: 500;
        color: var(--cream);
      }
      .sub strong { color: var(--amber); font-weight: 700; }
      .cta {
        display: inline-block;
        margin-top: 38px;
        text-decoration: none;
        font-family: 'Anton', 'Arial Narrow', sans-serif;
        font-size: clamp(20px, 5.5vw, 26px);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--charcoal);
        background: linear-gradient(180deg, var(--amber), var(--ember));
        padding: 0.85em 2.2em 0.75em;
        border-radius: 14px;
        box-shadow: 0 8px 40px rgba(216, 31, 38, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition: transform 0.15s ease;
      }
      .cta:hover { transform: translateY(-2px); }
      .cta:active { transform: translateY(1px) scale(0.99); }
      .small {
        margin-top: 42px;
        font-size: 13px;
        color: var(--smoke);
      }
      .small a { color: var(--smoke); }
    </style>
  </head>
  <body>
    <p class="kicker">102 Pisgah Street · Kenfig Hill</p>
    <h1>Y<span>U</span>MMIES</h1>
    <p class="msg">We built you <em>a website.</em></p>
    <p class="sub">
      Your kebabs, filmed. Customers build their order, watch the price, and it lands
      <strong>straight on your WhatsApp</strong> — no middleman, no commission.
    </p>
    <a class="cta" href="./">Have a look</a>
    <p class="small">Nothing to install, nothing to sign — it's already made. Tap through and try it.</p>
  </body>
</html>
