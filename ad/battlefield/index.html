<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battlefield — QuickSite Ad</title>
<meta name="description" content="QuickSite's 30-second Facebook ad — every trade's site fixes itself while nobody's watching.">
<meta name="theme-color" content="#0B0C0D">
<meta property="og:title" content="Battlefield — QuickSite Ad">
<meta property="og:description" content="30-second Facebook ad for QuickSite.">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --black:#0B0C0D;
    --panel:#141618;
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.18);
    --ink:#F2F3F4;
    --ink-2:#9AA0A6;
    --ink-3:#6B7075;
    --live:#B9F227;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--black)}
  body{
    margin:0;background:var(--black);color:var(--ink);
    font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(1.25rem,4vw,3rem);
  }
  .wrap{width:100%;max-width:900px}
  .kick{
    font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--live);margin:0 0 .8rem;
    display:flex;align-items:center;gap:.55rem;
  }
  .kick::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--live);flex:none}
  h1{
    margin:0 0 .5rem;font-size:clamp(1.6rem,4.4vw,2.5rem);font-weight:800;
    letter-spacing:-.03em;line-height:1.05;text-wrap:balance;
  }
  .lead{color:var(--ink-2);margin:0 0 1.75rem;max-width:56ch;font-size:1rem}
  .frame{
    position:relative;border-radius:10px;overflow:hidden;
    border:1px solid var(--line-2);background:var(--panel);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.7);
  }
  video{display:block;width:100%;height:auto;background:#000}
  .meta{
    display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;justify-content:space-between;
    margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:.75rem;color:var(--ink-3);letter-spacing:.02em;
  }
  .meta span{white-space:nowrap}
  footer{margin-top:2.5rem;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);letter-spacing:.04em}
  footer a{color:var(--ink-2)}
</style>
</head>
<body>
  <div class="wrap">
    <p class="kick">QuickSite &middot; Facebook ad</p>
    <h1>Battlefield</h1>
    <p class="lead">30 seconds. Every job on the tools, then the site that turns it into work — fixing itself while nobody's watching.</p>
    <div class="frame">
      <video controls playsinline preload="metadata" poster="poster.jpg">
        <source src="battlefield.mp4" type="video/mp4">
      </video>
    </div>
    <div class="meta">
      <span>1920&times;1080 &middot; 24fps &middot; 30.000s</span>
      <span>30&nbsp;MB &middot; MP4/H.264</span>
    </div>
    <footer>quicksite&nbsp;&middot;&nbsp;<a href="https://leedavidsherriff.github.io/quicksite-uk/">quicksite-uk</a></footer>
  </div>
</body>
</html>
