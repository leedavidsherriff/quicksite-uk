<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmet — your new website is ready</title>
    <meta name="description" content="Yummies has a new website. Watch it work, then tap through and try it." />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ahmet — your new website is ready" />
    <meta property="og:description" content="Yummies, filmed. Watch the demo, then tap through and build a kebab on your own site." />
    <meta property="og:image" content="https://leedavidsherriff.github.io/quicksite-uk/yummys-76f3343/og.jpg" />
    <meta property="og:url" content="https://leedavidsherriff.github.io/quicksite-uk/yummys-welcome-76f3343/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0A0A'/%3E%3Ctext x='50' y='72' font-family='Arial Black,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23D81F26'%3EY%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --charcoal: #0a0a0a;
        --ember: #d81f26;
        --amber: #f0a81e;
        --cream: #f6efe4;
        --smoke: #8b8279;
      }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 22px 34px;
        background:
          radial-gradient(90% 55% at 50% 108%, rgba(216, 31, 38, 0.2) 0%, rgba(216, 31, 38, 0.05) 45%, transparent 70%),
          var(--charcoal);
        color: var(--cream);
        font-family: 'Space Grotesk', system-ui, sans-serif;
        line-height: 1.5;
      }
      .kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--amber);
      }
      h1 {
        font-family: 'Anton', 'Arial Narrow', sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        line-height: 0.95;
        letter-spacing: 0.01em;
        font-size: clamp(40px, 11vw, 72px);
        margin-top: 14px;
        max-width: 13ch;
      }
      h1 em { font-style: normal; color: var(--ember); }
      .sub {
        max-width: 32ch;
        margin: 16px auto 0;
        font-size: clamp(15px, 4vw, 17px);
        font-weight: 500;
        color: var(--smoke);
      }
      .player {
        position: relative;
        width: min(78vw, 44svh);
        aspect-ratio: 9 / 16;
        margin-top: 26px;
        border-radius: 22px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(246, 239, 228, 0.08);
      }
      .player video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(10, 10, 10, 0.1), rgba(10, 10, 10, 0.45));
        border: 0;
        cursor: pointer;
        transition: opacity 0.25s;
      }
      .play.hidden { opacity: 0; pointer-events: none; }
      .play span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: linear-gradient(180deg, var(--amber), var(--ember));
        box-shadow: 0 10px 44px rgba(216, 31, 38, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .play svg { margin-left: 7px; }
      .cta {
        display: block;
        width: min(420px, 100%);
        margin-top: 26px;
        text-decoration: none;
        font-family: 'Anton', 'Arial Narrow', sans-serif;
        font-size: clamp(19px, 5vw, 24px);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--charcoal);
        background: linear-gradient(180deg, var(--amber), var(--ember));
        padding: 0.85em 1em 0.75em;
        border-radius: 14px;
        box-shadow: 0 8px 40px rgba(216, 31, 38, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        transition: transform 0.15s ease;
      }
      .cta:hover { transform: translateY(-2px); }
      .cta:active { transform: translateY(1px) scale(0.99); }
      .sig {
        margin-top: 30px;
        font-size: 13px;
        color: var(--smoke);
        line-height: 1.7;
      }
      .sig strong { color: var(--cream); font-weight: 700; }
      .sig a { color: var(--smoke); text-decoration: none; }
    </style>
  </head>
  <body>
    <p class="kicker">102 Pisgah Street · Kenfig Hill</p>
    <h1>Ahmet — your new website <em>is ready.</em></h1>
    <p class="sub">Thirty seconds, sound on. Then tap through and build a kebab on it yourself.</p>

    <div class="player">
      <video id="demo" src="yummys-demo.mp4" playsinline preload="metadata" poster="https://leedavidsherriff.github.io/quicksite-uk/yummys-76f3343/hero-poster.jpg"></video>
      <button class="play" id="play" aria-label="Play the demo">
        <span>
          <svg width="34" height="38" viewBox="0 0 34 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 15.5c2.7 1.6 2.7 5.4 0 7L6 37.2C3.3 38.8 0 36.9 0 33.7V4.3C0 1.1 3.3-.8 6 .8L32 15.5z" fill="#0A0A0A"/>
          </svg>
        </span>
      </button>
    </div>

    <a class="cta" href="https://leedavidsherriff.github.io/quicksite-uk/yummys-76f3343/">View your live site</a>

    <p class="sig">
      <strong>Lee Sherriff</strong> · QuickSite<br />
      <a href="tel:+447933666396">07933 666396</a> · <a href="mailto:lee@quick-site.co.uk">lee@quick-site.co.uk</a>
    </p>

    <script>
      const v = document.getElementById('demo')
      const btn = document.getElementById('play')
      btn.addEventListener('click', () => {
        btn.classList.add('hidden')
        v.play()
      })
      v.addEventListener('pause', () => btn.classList.remove('hidden'))
      v.addEventListener('ended', () => btn.classList.remove('hidden'))
      v.addEventListener('click', () => { if (!v.paused) v.pause() })
    </script>
  </body>
</html>
